<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>chat-radar 控制台</title>
<style>
  :root {
    --bg:#f7f1e8; --glow:#fce4cf; --card:#fffdf9; --ink:#3f3831; --dim:#94897b; --line:#ece2d3;
    --hot:#ee6f5b; --hot-bg:#fdeae4; --lead:#5aa27b; --lead-bg:#e7f2ea; --reply:#5b90b3; --reply-bg:#e6eff4;
    --watch:#d99a52; --watch-bg:#faefdd; --ignore:#bdb2a2; --ignore-bg:#f2ede4; --accent:#e0895a;
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1100px 480px at 50% -240px, var(--glow), transparent 70%), var(--bg); padding:34px 18px 70px; }
  .wrap { max-width:960px; margin:0 auto; }
  .greet { margin-bottom:18px; }
  .row1 { display:flex; align-items:baseline; gap:12px; }
  .hi { font-size:27px; font-weight:800; letter-spacing:.5px; } .today { color:var(--dim); font-size:13px; }
  .hi-sub { color:var(--dim); font-size:15px; margin-top:3px; }
  .toolbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 16px; margin:16px 0 18px;
    border:1px solid var(--line); border-radius:16px; background:var(--card); box-shadow:0 6px 22px rgba(190,150,110,.10); }
  .toggle { display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; }
  .toggle input { width:34px; height:19px; -webkit-appearance:none; appearance:none; background:#e2d8c8; border-radius:20px; position:relative; cursor:pointer; transition:.2s; }
  .toggle input:checked { background:var(--lead); }
  .toggle input::after { content:''; position:absolute; width:15px; height:15px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .toggle input:checked::after { left:17px; }
  select { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:#fffdf9; color:var(--ink); font-size:14px; cursor:pointer; }
  .btn { padding:8px 16px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 3px 10px rgba(224,137,90,.3); }
  .btn:hover { filter:brightness(1.05); } .btn:disabled { opacity:.55; }
  .dim { color:var(--dim); font-size:13px; } .spacer { flex:1; }
  .link { color:var(--dim); text-decoration:none; font-size:13px; margin-left:12px; } .link:hover { color:var(--accent); }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { padding:8px 18px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:14px; font-weight:600; cursor:pointer; transition:.15s; }
  .tab:hover { color:var(--ink); } .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 3px 10px rgba(224,137,90,.25); }
  .tab .n { font-size:12px; opacity:.75; margin-left:4px; }
  .banner { display:none; padding:10px 14px; border-radius:12px; background:#fff5e9; border:1px solid #f0d9bd; color:#b06a2c; font-size:14px; margin-bottom:14px; } .banner.show { display:block; }

  .board { column-count:3; column-gap:14px; }
  @media (max-width:760px){ .board{ column-count:2; } } @media (max-width:480px){ .board{ column-count:1; } }
  .card { break-inside:avoid; -webkit-column-break-inside:avoid; margin:0 0 14px; padding:14px 15px;
    border:1px solid var(--line); border-radius:16px; background:var(--card); box-shadow:0 3px 14px rgba(190,150,110,.08); transition:transform .12s, box-shadow .12s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(190,150,110,.16); }
  .cardhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 11px; border-radius:20px; }
  .tag svg { width:13px; height:13px; }
  .card.hot .tag { background:var(--hot); color:#fff; } .card.lead .tag { background:var(--lead-bg); color:var(--lead); }
  .card.reply .tag { background:var(--reply-bg); color:var(--reply); } .card.watch .tag { background:var(--watch-bg); color:#b57a2f; }
  .card.ignore .tag { background:var(--ignore-bg); color:#8b8172; }
  .meta { display:flex; align-items:center; gap:6px; font-size:12px; }
  .atn { background:var(--hot); color:#fff; border-radius:20px; padding:1px 7px; font-weight:700; font-size:11px; }
  .when { color:var(--dim); }
  .card.hot { border-color:#f0b0a2; background:linear-gradient(135deg,#fdeae4,#fbdbc9); box-shadow:0 5px 20px rgba(238,111,91,.22); position:relative; overflow:hidden; }
  .card.hot::after { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--hot); box-shadow:0 0 14px 1px var(--hot); animation:glow 2s ease-in-out infinite; }
  @keyframes glow { 0%,100%{opacity:.55} 50%{opacity:1} }
  .card.ignore { opacity:.72; }
  .cname { font-size:15px; font-weight:700; }
  .topic { color:var(--accent); font-weight:600; }
  .gist { font-size:14px; margin-top:6px; color:#4a423a; }
  .act { font-size:13px; color:var(--lead); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .empty { text-align:center; color:var(--dim); padding:56px 0; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="greet">
    <div class="row1"><div class="hi" id="greetLine">你好 👋</div><span class="today" id="today"></span></div>
    <div class="hi-sub" id="greetSub">正在为你看群…</div>
  </div>
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="timerOn" /> 自动盯梢</label>
    <select id="interval"><option value="15">每 15 分钟</option><option value="30">每 30 分钟</option><option value="60">每小时</option><option value="120">每 2 小时</option><option value="360">每 6 小时</option></select>
    <button class="btn" id="refreshBtn">↻ 立即看一遍</button>
    <span class="dim" id="lastRun">—</span><span class="spacer"></span>
    <a class="link" href="/config">⚙ 配置</a><a class="link" id="feishuLink" target="_blank" rel="noopener">🔗 飞书</a>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-f="today">今天<span class="n" id="n-today"></span></div>
    <div class="tab" data-f="yesterday">昨天<span class="n" id="n-yesterday"></span></div>
    <div class="tab" data-f="week">本周内<span class="n" id="n-week"></span></div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="board" id="board"><div class="empty">正在翻你的群…</div></div>
  <div style="text-align:center;color:var(--dim);font-size:12px;margin-top:34px">chat-radar v0.5.0 · 本地自托管 · 数据只在你机器上</div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const SVG = {
    hot:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1.2 3-1.2 4.2-2.2 6.2C8.9 9.7 9 11 10.3 12c.5-.9 1-1.7 1.5-2.3.6 2.2 2.2 3.2 2.2 5.3a4 4 0 11-8 .2c0-2.7 2.1-4.3 2.1-7C8.6 5.6 10.8 4.2 12 2z"/></svg>',
    lead:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="15" width="14" height="4" rx="1"/><path d="M9 15V9a3 3 0 016 0v6"/><circle cx="12" cy="6" r="1.6"/></svg>',
    reply:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H8l-4 4z"/></svg>',
    watch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>',
    ignore:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3A9 9 0 1021 13.5 7 7 0 0115.5 3z"/></svg>',
  };
  const CAT = { lead:'拍板', reply:'接话', watch:'吃瓜', ignore:'免看' };
  const ORDER = { hot:0, lead:1, reply:2, watch:3, ignore:4 };
  const esc = (s) => String(s||'').replace(/[<>&]/g,(c)=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  let allRows = [], curFilter = 'today', myName = '';
  const now = new Date();
  $('today').textContent = `${now.getMonth()+1}月${now.getDate()}日 星期${'日一二三四五六'[now.getDay()]}`;
  const inFilter = (r,f) => f==='today'?r.time_bucket==='today':f==='yesterday'?r.time_bucket==='yesterday':['today','yesterday','week'].includes(r.time_bucket);

  function renderGreet(hot, total) {
    const h = now.getHours(); let word='你好', emo='👋';
    if (h<6){word='夜深了';emo='🌙';} else if(h<11){word='早上好';emo='☀️';} else if(h<14){word='中午好';emo='🌤️';} else if(h<18){word='下午好';emo='🌤️';} else {word='晚上好';emo='🌙';}
    $('greetLine').textContent = `${word}，${myName||'你'} ${emo}`;
    $('greetSub').textContent = hot>0?`今天有 ${hot} 件火线等你先看，其余的我替你盯着。`:total>0?`没有火线，${total} 件事可以慢慢看，不急。`:'今天挺清净，喝杯茶歇会儿吧 ☕';
  }
  function timeAgo(iso){ if(!iso) return ''; const m=(Date.now()-new Date(iso.replace(' ','T')).getTime())/60000; if(isNaN(m))return''; if(m<60)return Math.max(1,Math.round(m))+'分钟前'; if(m<1440)return Math.round(m/60)+'小时前'; return Math.round(m/1440)+'天前'; }
  function decision(r){ return r.hot?{svg:SVG.hot,label:'火线',cls:'hot'}:{svg:SVG[r.category],label:CAT[r.category]||r.category,cls:r.category}; }

  function cardHtml(r) {
    const d = decision(r);
    const t = r.topic || r.related;
    const topic = t ? ' · <span class="topic">'+esc(t)+'</span>' : '';
    const when = timeAgo(r.latest_time);
    const at = r.mention_count>0 ? '<span class="atn">@'+r.mention_count+'</span>' : '';
    const meta = (at||when) ? '<span class="meta">'+at+(when?'<span class="when">'+when+'</span>':'')+'</span>' : '<span></span>';
    const act = (r.category!=='ignore' && r.suggested_action) ? '<div class="act">↳ '+esc(r.suggested_action)+'</div>' : '';
    return '<div class="card '+d.cls+'"><div class="cardhead"><span class="tag">'+d.svg+d.label+'</span>'+meta+'</div>'
      + '<div class="cname">'+esc(r.chat_name)+topic+'</div><div class="gist">'+esc(r.headline)+'</div>'+act+'</div>';
  }
  function render() {
    const rows = allRows.filter((r)=>inFilter(r,curFilter)).sort((a,b)=>(b.hot?0:1)-(a.hot?0:1)||(ORDER[a.category]??9)-(ORDER[b.category]??9));
    $('board').innerHTML = rows.length ? rows.map(cardHtml).join('') : '<div class="empty">这个时间段没有需要关注的群 🍃</div>';
  }
  function updateTabCounts() {
    $('n-today').textContent = allRows.filter((r)=>r.time_bucket==='today').length || '';
    $('n-yesterday').textContent = allRows.filter((r)=>r.time_bucket==='yesterday').length || '';
    $('n-week').textContent = allRows.filter((r)=>['today','yesterday','week'].includes(r.time_bucket)).length || '';
  }
  function ago(iso){ if(!iso)return '还没看过'; const m=(Date.now()-new Date(iso.replace(' ','T')).getTime())/60000; if(isNaN(m))return''; if(m<1)return'刚看过'; if(m<60)return Math.round(m)+' 分钟前看的'; return Math.round(m/60)+' 小时前看的'; }

  async function loadVerdicts(autoFirst) {
    const [j, prof] = await Promise.all([fetch('/api/verdicts').then((x)=>x.json()).catch(()=>({rows:[]})), fetch('/api/profile').then((x)=>x.json()).catch(()=>({}))]);
    myName = (prof && prof.name) || ''; allRows = j.rows || [];
    updateTabCounts(); render();
    renderGreet(allRows.filter((r)=>r.hot && r.time_bucket==='today').length, allRows.length);
    $('lastRun').textContent = ago(j.lastRun);
    $('timerOn').checked = !!(j.timer && j.timer.enabled);
    if (j.timer && j.timer.intervalMin) $('interval').value = String(j.timer.intervalMin);
    if (j.baseUrl) $('feishuLink').href = j.baseUrl; else $('feishuLink').style.display='none';
    if (autoFirst && allRows.length===0 && !(j.timer && j.timer.running)) triggerRefresh();
  }
  async function triggerRefresh(){ $('refreshBtn').disabled=true; $('banner').classList.add('show'); $('banner').textContent='☕ 正在替你翻群、逐个琢磨…'; try{ await fetch('/api/refresh',{method:'POST'}); }catch{} }

  const es = new EventSource('/events');
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type==='refresh-start'){ $('refreshBtn').disabled=true; $('banner').classList.add('show'); $('banner').textContent='☕ 正在替你翻群、逐个琢磨…'; }
    else if (m.type==='refresh-log'){ const t=m.text.trim().split('\n').pop(); if(t)$('banner').textContent='☕ '+t.slice(0,64); }
    else if (m.type==='refresh-done'){ $('refreshBtn').disabled=false; $('banner').classList.remove('show'); loadVerdicts(false); }
    else if (m.type==='refresh-busy'){ $('banner').classList.add('show'); $('banner').textContent='已经在看了，稍等一下～'; }
  };
  $('tabs').onclick = (e) => { const t=e.target.closest('.tab'); if(!t)return; document.querySelectorAll('.tab').forEach((x)=>x.classList.remove('on')); t.classList.add('on'); curFilter=t.dataset.f; render(); };
  $('refreshBtn').onclick = triggerRefresh;
  function saveTimer(){ fetch('/api/timer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('timerOn').checked,intervalMin:Number($('interval').value)})}); }
  $('timerOn').onchange = saveTimer; $('interval').onchange = () => { if($('timerOn').checked) saveTimer(); };
  loadVerdicts(true);
</script>
</body>
</html>
