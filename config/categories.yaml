# 分诊分类定义 —— 改这里即改裁定行为，无需动代码。
# 每条会拼进裁定 prompt；desc 写得越准，AI 裁定越准。
# 想做「高校版」就复制一份改这些 desc（决策八），代码不用动。

categories:
  - key: ignore
    name: 免看
    emoji: "🔇"
    desc: 与我无关的噪音、闲聊、纯转发通知。不需要我看，默认折叠。

  - key: watch
    name: 吃瓜
    emoji: "👀"
    desc: 和我有点关系的背景信息，知悉即可，不需要我做任何动作。

  - key: reply
    name: 接话
    emoji: "💬"
    desc: 有人在等我的输入、回复或确认；我是贡献者，但不是主导者。

  - key: lead
    name: 拍板
    emoji: "🎯"
    desc: 我是这件事的负责人，需要我给方向、做决策或推动它往前。

# hot 是「紧急叠加标」，可与上面任一类共存；其余四类互斥。
overlay:
  - key: hot
    name: 火线
    emoji: "🔥"
    desc: 有人 @ 我、在催我，或正在做一个背着我、却影响我的决定。需要尽快反应。
